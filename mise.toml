[tools]
node = "24.22.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.lint]
alias = "l"
description = "Lint the code and GitHub Actions workflows"
run = [
  "npm run lint",
  "actionlint",
]

[tasks.test]
alias = "t"
description = "Run the tests"
run = "npm test"

[tasks.build]
alias = "b"
description = "Check the package would publish"
run = "npm pack --dry-run"

[tasks.gen]
description = "Regenerate dist/ from tokens.json and the designs in src/logo.js"
run = "npm run gen"

[tasks.check-generated]
description = "Fail if dist/'s SVG and CSS files don't match their sources"
file = "scripts/check-generated.sh"
